# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080  9080 9081
  port: 9080
  servlet:
    # 应用的访问路径
    context-path: /route
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 25

# 日志配置
logging:
  level:
    root: info
  pattern:
    console: "'%p%m%n'"

# Spring配置
spring:
  application:
    name: yunze-iotapi
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/iotdb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: ${REDIS_PASSWORD}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 8
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 80
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  rabbitmq:
    ####连接地址
    host: ${RABBITMQ_HOST}
    ####端口号
    port: 5672
    ####账号
    username: ${RABBITMQ_USER}
    ####密码
    password: ${RABBITMQ_PASSWORD}
    ## 心跳  请求的心跳超时，以秒为单位； 零表示没有
    requested-heartbeat: 40
    ####心跳开启
    keepalive: true
    ### 地址
    virtual-host: /${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          ####开启消费者（程序出现异常的情况下会）进行重试
          enabled: true
          ####最大重试次数
          max-attempts: 1
          ####重试间隔时间
          initial-interval: 3000
          #### 手动应答 manual  自动应答 auto
        acknowledge-mode: auto
# MyBatis配置
mybatis:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml







