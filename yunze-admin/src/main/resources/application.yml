# 项目相关配置
yunze:
  # 名称
  name: IoTLink
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2022v
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/yunze/uploadPath，Linux配置 /home/yunze/uploadPath）
  profile: D:/yunze/uploadPath
  # 获取ip地址开关
  addressEnabled: true
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 文件存储根目录
  storage:
    root: /mnt/file

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30

# 日志配置
logging:
  level:
    org.springframework: warn
    com.yunze: debug
# 文件上传配置
upload:
  chunk:
    # 分片临时目录
    temp-dir: /mnt/file/chunks
    # 分片大小（10MB）
    size: 10485760
    # 分片上传超时时间（120秒）
    timeout: 120000
# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  1024MB
      # 设置总上传的文件大小
      max-request-size:  1024MB
    mvc:
      async:
        request-timeout: 600000  # 10分钟，与前端超时时间一致
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # redis 配置
  redis:
    # 地址
    #    host: 117.78.11.108
    host: ${REDIS_HOST}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: Rdis20220107
    # 连接超时时间
    timeout: 30s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  rabbitmq:
    ####连接地址
    host: ${RABBITMQ_HOST}
    #    host: 117.78.11.108
    ####端口号
    port: 5672
    ####账号
    username: ${RABBITMQ_USER}
    #    username: IoTLinkRabbitMq
    ## 心跳  请求的心跳超时，以秒为单位； 零表示没有
    requested-heartbeat: 40
    ####密码
    password: ${RABBITMQ_PASSWORD}
    #    password: 20220107@yzIot
    ### 地址
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          ####开启消费者（程序出现异常的情况下会）进行重试
          enabled: true
          ####最大重试次数
          max-attempts: 1
          ####重试间隔时间
          initial-interval: 3000
        acknowledge-mode: manual
JvShuiTan:
  serverUrl: https://dev-api.jushuitan.com
  appKey: 69a8f339e77b4a9bbd82e43c7f31dc4d
  appSecret: ade9723b5b094ef1b2a277f1d487bb2f


# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认180分钟）
  expireTime: 180

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.yunze.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: false
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  #pathMapping: /dev-api
  pathMapping: /prod-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/yunze/*



