eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
logging:
  level:
    com:
      iot:
        business:
          dao: trace
    root: info
  pattern:
    console: "'%p%m%n'"
server:
  port: 9002
  servlet:
    context-path: /wechat
spring:
  application:
    name: wechat
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/iotdb?useSSL=false&serverTimezone=GMT%2B8&characterEncoding=utf-8
          username: ${MYSQL_USER}
          password: ${MYSQL_PASSWORD}

    hikari:
      connection-timeout: 60000
      max-lifetime: 60000
  devtools:
    restart:
      enabled: true
  redis:
    # 地址
    host: ${REDIS_HOST}
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: ${REDIS_PASSWORD}
    timeout: 10000
  resources:
    static-locations: classpath:/static/
